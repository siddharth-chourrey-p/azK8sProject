name: "Deploy AKS with terraform"

on:
  push:
    branches: ["master"] #Applied when pushed on main branch
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      action:
        description: "select action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: 'Type "yes" to Confirm destroy action'
        required: false
        default: "no"

permissions:
  contents: read

env:
  # Getting Azure creds from github secrets
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  terraform-deploy:
    name: "Terraform CI/CD (Dev)"
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./env/dev

    steps:
      # Checkout repo
      - name: checkout code
        uses: actions/checkout@v4

      # Install terraform in agent
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Terraform Init
      - name: Terraform init
        run: terraform init

      # Adjust formating
      - name: Terraform Format
        if: ${{ github.event.inputs.confirm != 'destroy'}}
        run: terraform fmt -check

      # Terrafrom Plan
      - name: Terraform Plan
        if: ${{ github.event.inputs.confirm != 'destroy'}}
        id: plan
        run: terraform plan
        continue-on-error: false

      # Step 6: Apply when push to master
      - name: Terraform Apply (Deploy to Azure)
        if: |
          (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
          (github.event.name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply')
        run: terraform apply -auto-approve

      # Step 7: Destroy when 'destroy' is selected
      - name: Terraform Destroy (Delete Resources)
        if: |
          github.event.name == 'workflow_dispatch' &&
          github.event.inputs.confirm == 'destroy' &&
          github.event.inputs.confirm_destroy == 'yes'
        run: terraform destroy -auto-approve
