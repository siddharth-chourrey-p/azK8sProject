name: "Deploy AKS with terraform"

on:
  push:
    branches: ["master"] #Applied when pushed on main branch
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      action:
        description: "select action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: 'Type "yes" to Confirm destroy action'
        required: false
        default: "no"

permissions:
  contents: read
  id-token: write

env:
  # Getting Azure creds from github secrets
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # TF_PLUGIN_CACHE_DIR is set at runtime in the step below (tilde ~ is not
  # expanded in GitHub Actions env blocks, causing a "no such file" error)

jobs:
  terraform-deploy:
    name: "Terraform CI/CD (Dev)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./env/dev

    steps:
      # Checkout repo
      - name: checkout code
        uses: actions/checkout@v4

      # Setup provider plugin cache directory and export path for Terraform
      - name: Setup Terraform plugin cache
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      # Cache azurerm provider binaries between runs via GitHub's cache service.
      # Key is locked to .terraform.lock.hcl — cache is only invalidated when
      # provider versions change. Saves ~3 min download on every run.
      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
        
      # Install terraform in agent
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Terraform Init
      # -upgrade=false: skip provider version re-checking when .terraform.lock.hcl is unchanged
      - name: Terraform init
        run: terraform init -upgrade=false

      # Adjust formating
      - name: Terraform Format
        if: inputs.action != 'destroy'
        run: terraform fmt -check

      # Terrafrom Plan
      - name: Terraform Plan
        if: inputs.action != 'destroy'
        id: plan
        run: terraform plan
        continue-on-error: false

      # Step 6: Apply when push to master
      - name: Terraform Apply (Deploy to Azure)
        if: |
          (github.ref == 'refs/heads/master' && 
          github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve

      # Step 7: Destroy when 'destroy' is selected
      - name: Terraform Destroy (Delete Resources)
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'destroy' &&
          inputs.confirm_destroy == 'yes'
        run: terraform destroy -auto-approve
